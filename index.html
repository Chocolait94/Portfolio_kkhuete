<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de kkhuete - Entrez dans l'univers d'une streameuse passionnée">
    <title>Bienvenue | Portfolio de kkhuete</title>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles-container" id="particles"></div>
    
    <!-- Animated Background Gradient -->
    <div class="animated-bg">
        <div class="gradient-circle circle-1"></div>
        <div class="gradient-circle circle-2"></div>
        <div class="gradient-circle circle-3"></div>
    </div>
    
    <!-- Main Content -->
    <main class="welcome-container">
        <div class="welcome-content">
            <!-- Logo Animation -->
            <div class="logo-container">
                <div class="logo-ring"></div>
                <div class="logo-ring ring-2"></div>
                <div class="logo-center">
                    <span class="logo-text">KK</span>
                </div>
            </div>
            
            <!-- Welcome Text -->
            <div class="text-container">
                <h1 class="welcome-title">
                    Bienvenue sur le portfolio de
                    <span class="highlight-name">kkhuete</span>
                </h1>
                <p class="welcome-subtitle">
                    <i class="fas fa-gamepad"></i>
                    Streameuse • Gameuse • Créatrice de contenu
                </p>
                <p class="welcome-description">
                    Préparez-vous à découvrir mon univers
                </p>
            </div>
            
            <!-- Start Button -->
            <div class="button-container">
                <a href="main.html" class="start-button">
                    <span class="button-text">Commencer l'aventure</span>
                    <span class="button-icon">
                        <i class="fas fa-arrow-right"></i>
                    </span>
                    <span class="button-glow"></span>
                </a>
                <p class="button-hint">
                    <i class="fas fa-mouse"></i>
                    Cliquez pour entrer
                </p>
            </div>
            
            <!-- Social Links Preview -->
            <div class="social-preview">
                <a href="https://www.twitch.tv/kkhuetei" target="_blank" class="social-icon" aria-label="Twitch">
                    <i class="fab fa-twitch"></i>
                </a>
                <a href="https://www.instagram.com/kkhuetei" target="_blank" class="social-icon" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/@kkhuetei" target="_blank" class="social-icon" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://discord.gg/pqZtB54ET4" target="_blank" class="social-icon" aria-label="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
        </div>
    </main>
    
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
        </div>
        <p class="loading-text">Chargement<span class="dots"></span></p>
    </div>
</body>
</html>
